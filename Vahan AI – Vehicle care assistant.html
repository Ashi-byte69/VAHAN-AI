<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">V</span>Vahan<span class="brandAi">AI</span></div>
      <div class="sideLabel">MENU</div>
      <nav class="nav" id="nav"></nav>
      <div class="sideFoot">
        <div class="miniCard">
          <span>✦</span>
          <b>Ask the assistant</b>
          <p>Get quick answers about service, warning lights and insurance.</p>
          <button data-go="assistant">Start a chat</button>
        </div>
        <button class="userMini" data-go="settings">
          <span class="avatar" id="avatarSide">S</span>
          <span><b id="userName">Student</b><small>Demo account</small></span>
          <i>•••</i>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="hamb" id="hamb" aria-label="Open menu">☰</button>
        <div class="crumb">Vahan AI<span>/</span><b id="crumb">Dashboard</b></div>
        <div class="topRight">
          <label for="vehicleSelect">Vehicle</label>
          <select id="vehicleSelect"></select>
          <span class="avatar" id="avatarTop">S</span>
        </div>
      </header>

      <main class="content" id="view"></main>

      <footer>
        <span>Vahan AI · College project</span>
        <span>Demo data is stored only in this browser</span>
      </footer>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script>"use strict";

/* ============================================================
   VAHAN AI – frontend logic
   API: leave API_BASE empty to run with DEMO data.
   When your backend is ready, set it (e.g. "https://your-app.vercel.app/api").
   Keep AI / OCR / provider keys on the backend, never in this file.
   Endpoints the backend should offer:
     POST /chat    {message, language, vehicle}         -> {reply}
     POST /scan    FormData(image, type)                -> {title, summary, fields:[[label,value]]}
     GET  /lookup?reg=TN01AB1234                        -> {vehicle, insurance, challans}
   ============================================================ */
const CONFIG = { API_BASE: "" };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage may be blocked */ } };
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = d => d ? new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "Not added";
const daysTo = d => d ? Math.ceil((new Date(d) - new Date().setHours(0, 0, 0, 0)) / 864e5) : null;
const uid = () => Math.random().toString(36).slice(2, 9);

const LANGS = { English: "en-IN", Hindi: "hi-IN", Tamil: "ta-IN", Kannada: "kn-IN", Telugu: "te-IN", Malayalam: "ml-IN" };
const PAGES = {
  dashboard: ["Dashboard", "▦"], vehicles: ["My vehicles", "🚗"], assistant: ["AI assistant", "✦"],
  scan: ["Scan photo", "⌕"], policy: ["Insurance", "🛡"], lookup: ["Challans & lookup", "#"],
  history: ["History", "↺"], settings: ["Settings", "⚙"]
};
const BADGE = { assistant: "Demo", scan: "Demo", lookup: "Soon" };
const ICON = { service: "🔧", chat: "✦", scan: "⌕", vehicle: "🚗", policy: "🛡", lookup: "#" };

const CAR = `<svg viewBox="0 0 300 120" aria-hidden="true"><path d="M20 82c0-10 8-14 20-16l34-26c8-6 18-8 30-8h60c14 0 26 6 36 16l22 18c14 2 20 6 20 16v8H20z" fill="#176b54"/><path d="M84 48l22-14h58c8 0 16 4 22 10l12 12H84z" fill="#dfece0"/><circle cx="76" cy="94" r="16" fill="#17251f"/><circle cx="76" cy="94" r="7" fill="#e5ebe6"/><circle cx="228" cy="94" r="16" fill="#17251f"/><circle cx="228" cy="94" r="7" fill="#e5ebe6"/></svg>`;

/* ---------- state ---------- */
const state = {
  page: "dashboard",
  vehicles: load("vahan_vehicles", [
    { id: "v1", name: "Volkswagen Polo", reg: "TN 01 AB 1234", type: "Car", fuel: "Petrol", year: 2019, insurer: "", policyNo: "", policyType: "", policyStart: "", insuranceExpiry: "", lastService: "" }
  ]),
  active: load("vahan_active", "v1"),
  history: load("vahan_history", []),
  settings: load("vahan_settings", { name: "Student", lang: "English", voice: true, notify: true, saveChats: true }),
  messages: [{ role: "bot", text: "Hi! Ask me anything about your vehicle, like warning lights, mileage or servicing." }],
  filter: "All", showAdd: false, editPolicy: false,
  scan: { file: null, url: null, type: "Service invoice", result: null, consent: false, busy: false },
  lookup: { result: null, busy: false }
};
const persist = () => {
  store("vahan_vehicles", state.vehicles); store("vahan_active", state.active);
  store("vahan_history", state.history); store("vahan_settings", state.settings);
};
const vehicle = () => state.vehicles.find(v => v.id === state.active) || state.vehicles[0] || null;
function addHistory(type, title, detail) {
  state.history.unshift({ id: uid(), type, title, detail, date: new Date().toISOString() });
  state.history = state.history.slice(0, 100); persist();
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600);
}

/* ---------- API layer (demo data until API_BASE is set) ---------- */
const KB = [
  [/overheat|hot|temperature|coolant/, "Overheating usually points to low coolant, a faulty fan or thermostat, or a leak. Switch off the engine, let it cool fully before opening the radiator cap, and check the coolant level. If it keeps happening, get it inspected soon. Driving an overheated engine can cause serious damage."],
  [/check.?engine|engine light|warning light/, "A check-engine light means the car's computer found a fault. It can be minor (like a loose fuel cap) or serious. If the light is steady, book an inspection soon. If it flashes, stop driving and call a mechanic."],
  [/mileage|fuel|efficiency/, "Lower mileage is often caused by low tyre pressure, a dirty air filter, old spark plugs or heavy-footed driving. Check tyre pressure first, since it is free and quick. If you tell me when you last had a service, I can narrow it down."],
  [/oil/, "Engine oil is usually changed every 5,000 to 10,000 km or once a year, depending on the oil type. Your owner's manual has the exact interval for your vehicle."],
  [/battery|not starting|won'?t start/, "If the car clicks but does not start, the battery is often weak or the terminals are loose or corroded. Try a jump-start and have the battery tested. Batteries commonly last 3 to 5 years."],
  [/noise|sound|squeal|grind/, "Squealing when braking often means worn brake pads. Grinding is more serious and needs a check right away. A knocking sound from the engine should also be inspected before driving further."]
];
const api = {
  async call(path, opts = {}) {
    const res = await fetch(CONFIG.API_BASE + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
    return data;
  },
  async chat(message) {
    if (CONFIG.API_BASE) {
      return this.call("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, language: state.settings.lang, vehicle: vehicle() }) });
    }
    await wait(700);
    const hit = KB.find(([re]) => re.test(message.toLowerCase()));
    let reply = hit ? hit[1] : "I can help with warning lights, servicing, mileage, battery and noises. Can you describe what you notice and when it happens?";
    if (state.settings.lang !== "English") reply += "\n\n(Demo mode replies in English. The connected backend will reply in " + state.settings.lang + ".)";
    return { reply };
  },
  async scan(file, type) {
    if (CONFIG.API_BASE) {
      const fd = new FormData(); fd.append("image", file); fd.append("type", type);
      return this.call("/scan", { method: "POST", body: fd });
    }
    await wait(1200);
    if (type === "Dashboard warning light") return { title: "Warning light guidance", summary: "Demo result. A photo alone cannot confirm a fault. Check your owner's manual for the symbol and have the vehicle inspected if the light stays on.", fields: [] };
    return { title: type + " (demo values)", summary: "These values are illustrative. Real extraction needs the OCR service on the backend.",
      fields: [["Service type", "General service"], ["Oil change", "Completed"], ["Labour", "₹800"], ["Parts", "₹2,500"], ["Total", "₹3,300"]] };
  },
  async lookup(reg) {
    if (CONFIG.API_BASE) return this.call("/lookup?reg=" + encodeURIComponent(reg));
    await wait(900);
    return { demo: true, reg, vehicle: "Details need an authorized vehicle data provider", insurance: "Needs an authorized insurance data source", challans: [] };
  }
};

/* ---------- views ---------- */
const head = (eyebrow, title, sub, extra = "") =>
  `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`;
const demoTag = { toString: () => (CONFIG.API_BASE ? "" : '<span class="demoTag">DEMO DATA</span>') };
const noVehicle = `<div class="panel empty">No vehicle yet. Add one to get started.<br><br><button class="btn" data-go="vehicles">Add a vehicle</button></div>`;

function reminders(v) {
  const r = [];
  const d = daysTo(v.insuranceExpiry);
  if (d !== null) r.push(["🛡", d < 0 ? "Insurance expired" : "Insurance renewal", d < 0 ? Math.abs(d) + " days ago" : "In " + d + " days (" + fmt(v.insuranceExpiry) + ")", "policy"]);
  else r.push(["🛡", "Add insurance expiry", "So you can get a renewal reminder", "policy"]);
  if (v.lastService) { const n = new Date(v.lastService); n.setMonth(n.getMonth() + 6); r.push(["🔧", "Next service (estimate)", "Around " + fmt(n) + ", 6 months after the last one", "vehicles"]); }
  else r.push(["🔧", "Add last service date", "Used to estimate your next service", "vehicles"]);
  r.push(["♻", "Pollution certificate", "Check that your PUC is still valid", "assistant"]);
  return r;
}

function pageDashboard() {
  const v = vehicle(); if (!v) return head("Welcome", "Hello, " + esc(state.settings.name), "Add your first vehicle.") + noVehicle;
  const d = daysTo(v.insuranceExpiry);
  const score = Math.max(40, 100 - (d === null ? 10 : d < 0 ? 40 : d < 30 ? 15 : 0) - (v.lastService ? 0 : 10));
  const rem = reminders(v);
  const stats = [["🚗", "Vehicle", v.name, v.type + " · " + v.fuel], ["#", "Registration", v.reg, "Year " + v.year],
    ["🛡", "Insurance", d === null ? "Not added" : d < 0 ? "Expired" : d + " days left", fmt(v.insuranceExpiry)], ["🔧", "Last service", fmt(v.lastService), "Added by you"]];
  const quick = [["mint", "✦", "Ask the assistant", "Questions in simple language", "assistant"], ["peach", "⌕", "Scan a photo", "Bills, documents, warning lights", "scan"],
    ["lavender", "🛡", "Insurance", "Policy details and renewal", "policy"], ["sky", "#", "Challans", "Check fines by registration", "lookup"]];
  return head("Dashboard", "Hello, " + esc(state.settings.name), "Everything for " + esc(v.name) + " in one place.", demoTag) + `
  <section class="hero"><div><small>YOUR VEHICLE</small><h2>${esc(v.name)}</h2><p>${esc(v.reg)}</p><button data-go="vehicles">Manage vehicles</button></div>
    <div class="carArt"><div class="sun"></div>${CAR}</div><div class="health"><b>${score}%</b><span>Care<br>score</span></div></section>
  <section class="stats">${stats.map(s => `<div class="stat"><span>${s[0]}</span><small>${s[1]}</small><b>${esc(s[2])}</b><i>${esc(s[3])}</i></div>`).join("")}</section>
  <div class="sectionHead"><h2>Quick actions</h2></div>
  <section class="quickGrid">${quick.map(q => `<button class="quick" data-go="${q[4]}"><span class="quickIcon ${q[0]}">${q[1]}</span><b>${q[2]}</b><small>${q[3]}</small><i>›</i></button>`).join("")}</section>
  <section class="twoCols">
    <div class="panel"><div class="panelHead"><div><h2>Recent activity</h2><p>Latest actions on your account</p></div><button data-go="history">View all</button></div>
      ${state.history.slice(0, 4).map(historyRow).join("") || '<div class="empty">Nothing yet. Ask a question or scan a bill to begin.</div>'}</div>
    <div class="panel"><div class="panelHead"><div><h2>Reminders</h2><p>Based on dates you entered</p></div></div>
      ${rem.map(x => `<button class="reminder" data-go="${x[3]}"><span>${x[0]}</span><b>${x[1]}<small>${x[2]}</small></b><i>›</i></button>`).join("")}
      <div class="note">Reminders use only the dates you add. Mileage is never guessed.</div></div>
  </section>`;
}

function historyRow(h) {
  return `<div class="historyRow"><span>${ICON[h.type] || "•"}</span><b>${esc(h.title)}<small>${esc(h.detail)}</small></b><time>${fmt(h.date)}</time></div>`;
}

function pageVehicles() {
  const cards = state.vehicles.map(v => `<article class="vehicleCard ${v.id === vehicle()?.id ? "isActive" : ""}">
    <div class="cardTop"><span>${esc(v.type)}</span>${v.id === vehicle()?.id ? '<span class="current">Active</span>' : ""}</div>
    <div class="carArt">${CAR}</div><h2>${esc(v.name)}</h2><p>${esc(v.fuel)} · ${esc(v.year)}</p><span class="plate">${esc(v.reg)}</span>
    <div class="vehicleMeta"><span>Insurance<b>${fmt(v.insuranceExpiry)}</b></span><span>Last service<b>${fmt(v.lastService)}</b></span></div>
    <button class="btn ${v.id === vehicle()?.id ? "secondary" : ""}" data-act="setActive" data-arg="${v.id}">${v.id === vehicle()?.id ? "Selected" : "Use this vehicle"}</button>
    <button class="btn secondary" style="width:100%;margin-top:6px" data-act="delVehicle" data-arg="${v.id}">Remove</button></article>`).join("");
  const form = `<form class="panel addForm" data-form="addVehicle"><h2>Add a vehicle</h2><div class="formGrid">
    <label>Make and model<input name="name" required placeholder="TVS Jupiter"></label>
    <label>Registration number<input name="reg" required placeholder="TN 01 AB 1234"></label>
    <label>Type<select name="type"><option>Car</option><option>Motorcycle</option><option>Scooter</option></select></label>
    <label>Fuel<select name="fuel"><option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option></select></label>
    <label>Year<input name="year" type="number" min="1980" max="2030" value="2020"></label>
    <label>Last service <small>(optional)</small><input name="lastService" type="date"></label></div>
    <div class="formButtons"><button type="button" class="btn secondary" data-act="toggleAdd">Cancel</button><button class="btn">Save vehicle</button></div></form>`;
  return head("My vehicles", "Your vehicles", "Keep every car and bike in one account.", `<button class="btn" data-act="toggleAdd">+ Add vehicle</button>`) +
    (state.showAdd ? form : "") + (cards ? `<section class="vehicleGrid">${cards}</section>` : noVehicle);
}

function pageAssistant() {
  const msgs = state.messages.map((m, i) => `<div class="msg ${m.role === "user" ? "user" : ""}"><p>${esc(m.text)}</p>
    ${m.role === "bot" && !m.pending && state.settings.voice && "speechSynthesis" in window ? `<button data-act="speak" data-arg="${i}">🔊 Listen</button>` : ""}</div>`).join("");
  const tries = ["Why is my car overheating?", "What does the check-engine light mean?", "How often should I change engine oil?"];
  return head("AI assistant", "Ask Vahan AI", "Simple answers about your vehicle, in your language.", demoTag) + `
  <section class="assistantLayout"><div class="panel chat">
    <div class="chatHead"><span>✦</span><b>Vahan AI<small>${esc(vehicle()?.name || "No vehicle selected")} · ${esc(state.settings.lang)}</small></b><button data-act="clearChat">Clear</button></div>
    <div class="messages" id="messages">${msgs}</div>
    <div class="compose"><button id="micBtn" data-act="mic" aria-label="Speak">🎤</button>
      <form data-form="chat"><input name="q" autocomplete="off" placeholder="Type your question" aria-label="Your question"><button aria-label="Send">➤</button></form></div>
    <div class="disclaimer">AI can make mistakes. For safety issues, see a qualified mechanic.</div></div>
    <div class="panel tryPanel"><h2>Try asking</h2>${tries.map(t => `<button data-act="try" data-arg="${esc(t)}">${t}</button>`).join("")}
      <p>The assistant gives general guidance. It cannot diagnose faults from a description alone.</p></div></section>`;
}

function pageScan() {
  const s = state.scan, r = s.result;
  const types = ["Service invoice", "Repair bill", "Insurance document", "Registration document", "Dashboard warning light"];
  return head("Scan photo", "Scan a bill or document", "Upload a photo and Vahan AI explains what it finds.", demoTag) + `
  <section class="twoCols scanCols"><div class="panel scanPanel">
    <div class="scanHead"><div><h2>Upload a photo</h2><p>JPG or PNG, up to 8 MB. Make sure the text is sharp.</p></div>
      <select id="scanType" aria-label="Photo type">${types.map(t => `<option ${t === s.type ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <label class="dropZone">${s.url ? `<img src="${s.url}" alt="Your uploaded photo">` : `<span>⬆</span><b>Choose a photo</b><small>or take one with your camera</small>`}
      <input type="file" id="scanFile" accept="image/*"></label>
    ${s.file ? `<div class="fileLine"><b>${esc(s.file.name)}</b><button data-act="clearFile">Remove</button></div>` : ""}
    <label class="consentRow"><input type="checkbox" id="scanConsent" ${s.consent ? "checked" : ""}>I agree to send this photo for analysis. It may contain personal details.</label>
    <button class="btn" data-act="analyze" ${s.busy ? "disabled" : ""}>${s.busy ? "Analyzing…" : "Analyze photo"}</button>
    ${r ? `<div class="plannedResult"><b>${esc(r.title)}</b><p>${esc(r.summary)}</p>
      ${r.fields.map(f => `<div class="historyRow"><b>${esc(f[0])}</b><time>${esc(f[1])}</time></div>`).join("")}
      <button class="btn secondary" data-act="saveScan">Save to history</button></div>` : ""}</div>
    <div class="panel"><h2>Good photos to try</h2><hr>
      <div class="usecase"><span>🧾</span>Service invoices</div><div class="usecase"><span>🔧</span>Repair bills</div>
      <div class="usecase"><span>🛡</span>Insurance papers</div><div class="usecase"><span>📄</span>Registration card</div>
      <div class="usecase"><span>⚠</span>Dashboard lights</div>
      <div class="tip">A photo cannot confirm a mechanical fault. Treat results as guidance.</div></div></section>`;
}

function pagePolicy() {
  const v = vehicle(); if (!v) return head("Insurance", "Insurance", "Add a vehicle first.") + noVehicle;
  const d = daysTo(v.insuranceExpiry);
  const rows = [["Insurance company", v.insurer], ["Policy number", v.policyNo], ["Policy type", v.policyType], ["Start date", v.policyStart && fmt(v.policyStart)], ["Expiry date", v.insuranceExpiry && fmt(v.insuranceExpiry)]];
  const form = `<form data-form="policy" class="addForm"><div class="formGrid">
    <label>Insurance company<input name="insurer" value="${esc(v.insurer)}"></label><label>Policy number<input name="policyNo" value="${esc(v.policyNo)}"></label>
    <label>Policy type<select name="policyType">${["", "Third party", "Comprehensive"].map(o => `<option ${o === v.policyType ? "selected" : ""}>${o}</option>`).join("")}</select></label>
    <label>Start date<input name="policyStart" type="date" value="${esc(v.policyStart)}"></label><label>Expiry date<input name="insuranceExpiry" type="date" value="${esc(v.insuranceExpiry)}"></label></div>
    <div class="formButtons"><button type="button" class="btn secondary" data-act="editPolicy">Cancel</button><button class="btn">Save policy</button></div></form>`;
  return head("Insurance", "Insurance for " + esc(v.name), esc(v.reg)) + `
  <div class="coming"><span>ⓘ</span><div><b>Automatic policy lookup is coming soon</b><p>Fetching a policy from a registration number needs an authorized insurance data source. For now, enter your details by hand.</p></div></div>
  <section class="twoCols policyCols"><div class="panel"><div class="panelHead"><div><h2>Policy details</h2><p>Entered by you</p></div></div>
    ${state.editPolicy ? form : `<div class="policyGrid">${rows.map(r => `<span>${r[0]}<b>${esc(r[1] || "Not added")}</b></span>`).join("")}</div>
    <div class="policyFoot"><small>Stored only in this browser</small><button class="btn secondary" data-act="editPolicy">Edit details</button></div>`}</div>
    <div class="panel renewal"><span>🛡</span><div class="eyebrow">RENEWAL</div><h2>${d === null ? "No expiry date yet" : d < 0 ? "Policy expired" : "Renews in " + d + " days"}</h2>
      <p>${d === null ? "Add your expiry date to get a reminder." : "Compare offers before you renew. Renew on your insurer's official site."}</p>
      <div class="expiry">Expiry date<b>${fmt(v.insuranceExpiry)}</b></div></div></section>`;
}

function pageLookup() {
  const r = state.lookup.result;
  const feats = [["#", "Vehicle details", "Make, model and registration data"], ["🛡", "Insurance status", "Policy and expiry information"], ["⚠", "Traffic challans", "Outstanding fines and payment links"]];
  return head("Challans & lookup", "Check a registration number", "See vehicle, insurance and challan information in one search.", '<span class="demoTag">COMING SOON</span>') + `
  <div class="coming"><span>ⓘ</span><div><b>Live data is not connected yet</b><p>Challan and vehicle lookups need authorized government or provider access. This screen is ready for those APIs and shows no real records.</p></div></div>
  <section class="panel lookup"><h2>Registration number</h2><form data-form="lookup"><label for="reg">Enter your vehicle registration number</label>
    <div><input id="reg" name="reg" required placeholder="TN 01 AB 1234" value="${esc(vehicle()?.reg || "")}"><button class="btn" ${state.lookup.busy ? "disabled" : ""}>${state.lookup.busy ? "Checking…" : "Check"}</button></div></form>
    ${r ? `<div class="plannedResult"><b>${esc(r.reg)}</b><p>${esc(r.vehicle)}<br>${esc(r.insurance)}<br>${r.challans.length ? r.challans.length + " challan(s) found" : "No challan data available yet"}</p>
      <small>${r.demo ? "Demo mode. Nothing was retrieved." : ""}</small></div>` : ""}</section>
  <div class="sectionHead"><div><h2>What this will show</h2></div></div>
  <section class="featureGrid">${feats.map(f => `<div class="miniFeature"><span>${f[0]}</span><b>${f[1]}</b><p>${f[2]}</p></div>`).join("")}</section>`;
}

function pageHistory() {
  const filters = ["All", "Service", "Chat", "Scan", "Vehicle", "Policy"];
  const list = state.history.filter(h => state.filter === "All" || h.type === state.filter.toLowerCase());
  const count = t => state.history.filter(h => h.type === t).length;
  return head("History", "Vehicle history", "Everything you have done in Vahan AI.") + `
  <div class="historySummary"><span>Records<b>${state.history.length}</b></span><span>Scans<b>${count("scan")}</b></span><span>Questions<b>${count("chat")}</b></span><span>Vehicles<b>${state.vehicles.length}</b></span></div>
  <div class="filters">${filters.map(f => `<button class="${f === state.filter ? "on" : ""}" data-act="filter" data-arg="${f}">${f}</button>`).join("")}</div>
  <div class="panel historyList">${list.map(historyRow).join("") || '<div class="empty">No records here yet.</div>'}</div>`;
}

function pageSettings() {
  const s = state.settings;
  const tog = (n, t, sub) => `<label class="toggle"><span><b>${t}</b><small>${sub}</small></span><input type="checkbox" name="${n}" ${s[n] ? "checked" : ""}></label>`;
  return head("Settings", "Profile and settings", "Your preferences are saved in this browser.") + `
  <section class="settingsLayout"><form class="panel settings" data-form="settings">
    <section><h2>Profile</h2><p>How we greet you.</p><label>Your name<input name="name" value="${esc(s.name)}" maxlength="40"></label></section>
    <section><h2>Preferred language</h2><p>Answers use this language, even if you type in another.</p>
      <label>Language<select name="lang">${Object.keys(LANGS).map(l => `<option ${l === s.lang ? "selected" : ""}>${l}</option>`).join("")}</select></label></section>
    <section><h2>Voice and notifications</h2>${tog("voice", "Read answers aloud", "Shows a Listen button on replies")}${tog("notify", "Reminders", "Insurance and service reminders")}</section>
    <section><h2>Privacy</h2>${tog("saveChats", "Keep activity history", "Turn off to stop saving new history")}
      <button type="button" class="btn secondary" style="margin-top:8px" data-act="resetAll">Delete all my data</button></section>
    <div class="saveRow"><small>Changes apply after you save</small><button class="btn">Save settings</button></div></form>
    <div class="panel langCard"><span>🌐</span><h2>Languages</h2><p>Your saved language stays the same even if you ask a question in a different one.</p>
      <div>${Object.keys(LANGS).map(l => `<small class="${l === s.lang ? "chosen" : ""}">${l}</small>`).join("")}</div></div></section>`;
}

const VIEWS = { dashboard: pageDashboard, vehicles: pageVehicles, assistant: pageAssistant, scan: pageScan, policy: pagePolicy, lookup: pageLookup, history: pageHistory, settings: pageSettings };

/* ---------- render ---------- */
function render() {
  $("#view").innerHTML = VIEWS[state.page]();
  $("#crumb").textContent = PAGES[state.page][0];
  $("#nav").innerHTML = Object.entries(PAGES).map(([id, [label, icon]]) =>
    `<button data-go="${id}" class="${id === state.page ? "selected" : ""}"><span class="navIcon">${icon}</span>${label}${BADGE[id] && (id === "lookup" || !CONFIG.API_BASE) ? `<small>${BADGE[id]}</small>` : ""}</button>`).join("");
  $("#vehicleSelect").innerHTML = state.vehicles.map(v => `<option value="${v.id}" ${v.id === vehicle()?.id ? "selected" : ""}>${esc(v.name)} · ${esc(v.reg)}</option>`).join("") || "<option>No vehicles</option>";
  const initial = (state.settings.name || "S").trim().charAt(0).toUpperCase();
  $("#userName").textContent = state.settings.name; $("#avatarSide").textContent = initial; $("#avatarTop").textContent = initial;
  $("#sidebar").classList.remove("open");
  const m = $("#messages"); if (m) m.scrollTop = m.scrollHeight;
}
const go = p => { state.page = p; render(); window.scrollTo(0, 0); };

/* ---------- actions ---------- */
async function sendChat(text) {
  text = text.trim(); if (!text) return;
  state.messages.push({ role: "user", text }, { role: "bot", text: "Thinking…", pending: true }); render();
  let reply;
  try { reply = (await api.chat(text)).reply; } catch (err) { reply = err.name === "TypeError" ? "I couldn't reach the assistant. Check your connection and try again." : err.message; }
  state.messages.pop(); state.messages.push({ role: "bot", text: reply });
  if (state.settings.saveChats) addHistory("chat", "Asked the assistant", text.slice(0, 70));
  render();
}
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Voice input isn't supported in this browser. Try Chrome.");
  const rec = new SR(); rec.lang = LANGS[state.settings.lang]; $("#micBtn")?.classList.add("listening");
  rec.onresult = e => sendChat(e.results[0][0].transcript);
  rec.onerror = () => toast("Couldn't hear you. Check microphone permission.");
  rec.onend = () => $("#micBtn")?.classList.remove("listening");
  rec.start();
}
function speak(i) {
  const u = new SpeechSynthesisUtterance(state.messages[i].text.split("\n\n(Demo")[0]);
  u.lang = LANGS[state.settings.lang]; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function setFile(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) return toast("Please choose an image file.");
  if (file.size > 8 * 1024 * 1024) return toast("That photo is over 8 MB. Choose a smaller one.");
  if (state.scan.url) URL.revokeObjectURL(state.scan.url);
  Object.assign(state.scan, { file, url: URL.createObjectURL(file), result: null }); render();
}
async function analyze() {
  const s = state.scan;
  if (!s.file) return toast("Choose a photo first.");
  if (!s.consent) return toast("Please tick the consent box to continue.");
  s.busy = true; render();
  try { s.result = await api.scan(s.file, s.type); } catch (err) { toast(err.message || "Analysis failed. Try again with a clearer photo."); }
  s.busy = false; render();
}

const ACTIONS = {
  toggleAdd: () => { state.showAdd = !state.showAdd; render(); },
  setActive: id => { state.active = id; persist(); render(); toast("Vehicle selected"); },
  delVehicle: id => { if (!confirm("Remove this vehicle?")) return; state.vehicles = state.vehicles.filter(v => v.id !== id); state.active = state.vehicles[0]?.id; persist(); render(); },
  try: t => sendChat(t), mic: startMic, speak,
  clearChat: () => { state.messages = state.messages.slice(0, 1); render(); },
  clearFile: () => { Object.assign(state.scan, { file: null, url: null, result: null }); render(); },
  analyze,
  saveScan: () => { addHistory("scan", state.scan.result.title, state.scan.type); toast("Saved to history"); },
  editPolicy: () => { state.editPolicy = !state.editPolicy; render(); },
  filter: f => { state.filter = f; render(); },
  resetAll: () => { if (confirm("Delete all vehicles, history and settings from this browser?")) { ["vahan_vehicles", "vahan_active", "vahan_history", "vahan_settings"].forEach(k => localStorage.removeItem(k)); location.reload(); } }
};

const FORMS = {
  addVehicle(f) {
    const v = { id: uid(), insurer: "", policyNo: "", policyType: "", policyStart: "", insuranceExpiry: "", ...Object.fromEntries(f) };
    state.vehicles.push(v); state.active = v.id; state.showAdd = false;
    addHistory("vehicle", "Added " + v.name, v.reg); toast("Vehicle added");
  },
  chat(f, form) { form.reset(); sendChat(f.get("q") || ""); return "skip"; },
  policy(f) {
    Object.assign(vehicle(), Object.fromEntries(f)); state.editPolicy = false;
    addHistory("policy", "Updated insurance details", vehicle().name); toast("Policy saved");
  },
  async lookup(f) {
    state.lookup.busy = true; render();
    try { state.lookup.result = await api.lookup(f.get("reg")); addHistory("lookup", "Looked up registration", f.get("reg")); }
    catch (err) { toast(err.message || "Lookup failed. Try again in a moment."); }
    state.lookup.busy = false; render(); return "skip";
  },
  settings(f) {
    state.settings = { name: f.get("name").trim() || "Student", lang: f.get("lang"), voice: f.has("voice"), notify: f.has("notify"), saveChats: f.has("saveChats") };
    toast("Settings saved");
  }
};

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const a = e.target.closest("[data-act]"); if (a) ACTIONS[a.dataset.act]?.(a.dataset.arg);
});
document.addEventListener("submit", async e => {
  const form = e.target.closest("[data-form]"); if (!form) return;
  e.preventDefault();
  const out = await FORMS[form.dataset.form](new FormData(form), form);
  if (out !== "skip") { persist(); render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "scanFile") setFile(e.target.files[0]);
  if (e.target.id === "scanType") { state.scan.type = e.target.value; state.scan.result = null; render(); }
  if (e.target.id === "scanConsent") state.scan.consent = e.target.checked;
  if (e.target.id === "vehicleSelect") { state.active = e.target.value; persist(); render(); }
});
$("#hamb").addEventListener("click", () => $("#sidebar").classList.toggle("open"));

render();

/* If the Node server is running, switch from demo data to the live backend. */
fetch("/api/health").then(r => (r.ok ? r.json() : null)).then(h => { if (h) { CONFIG.API_BASE = "/api"; render(); } }).catch(() => {});
</script>
</body>
</html>
